<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Group Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            padding: 0;
            margin: 0;
            background: transparent;
        }
        .sdpi-wrapper {
            padding: 10px;
        }
        .sdpi-item {
            margin-bottom: 15px;
        }
        .sdpi-item-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #9d9d9d;
            font-weight: 500;
        }
        select, input {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #3d3d3d;
            background: #2d2d2d;
            color: #d0d0d0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #0070f3;
        }
        .info-text {
            font-size: 11px;
            color: #7d7d7d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <label class="sdpi-item-label">Channel:</label>
            <select id="channel">
                <option value="1">Channel 1</option>
                <option value="2">Channel 2</option>
                <option value="3">Channel 3</option>
                <option value="4">Channel 4</option>
                <option value="5">Channel 5</option>
                <option value="6">Channel 6</option>
                <option value="7">Channel 7</option>
                <option value="8">Channel 8</option>
                <option value="9">Channel 9</option>
                <option value="10">Channel 10</option>
                <option value="11">Channel 11</option>
                <option value="12">Channel 12</option>
                <option value="13">Channel 13</option>
                <option value="14">Channel 14</option>
                <option value="15">Channel 15</option>
                <option value="16">Channel 16</option>
            </select>
            <div class="info-text">Select which channel to configure</div>
        </div>

        <div class="sdpi-item" id="groupSelection" style="display:none;">
            <label class="sdpi-item-label">Intercom Group:</label>
            <select id="group">
                <option value="0">No Group</option>
                <option value="1">Group 1</option>
                <option value="2">Group 2</option>
                <option value="3">Group 3</option>
                <option value="4">Group 4</option>
            </select>
            <div class="info-text">Select intercom group (for Set Group action)</div>
        </div>

        <div class="sdpi-item">
            <label class="sdpi-item-label">Server URL (optional):</label>
            <input type="text" id="serverUrl" placeholder="http://192.168.1.100:5016/api/intercom">
            <div class="info-text">Leave empty for localhost:5016. For remote: http://IP:5016/api/intercom</div>
        </div>
    </div>

    <script>
        let websocket = null;
        let uuid = null;
        let actionInfo = {};

        function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inPropertyInspectorUUID;

            if (inActionInfo) {
                try {
                    actionInfo = JSON.parse(inActionInfo);

                    // Legacy setgroup action removed; Rotate Group uses rotategroup UUID.
                } catch (e) {
                    console.error('Error parsing actionInfo:', e);
                }
            }

            websocket = new WebSocket('ws://127.0.0.1:' + inPort);

            websocket.onopen = function() {
                const json = {
                    event: inRegisterEvent,
                    uuid: inPropertyInspectorUUID
                };
                websocket.send(JSON.stringify(json));

                // Request current settings
                websocket.send(JSON.stringify({
                    event: 'getSettings',
                    context: uuid
                }));
            };

            websocket.onmessage = function(evt) {
                const jsonObj = JSON.parse(evt.data);

                if (jsonObj.event === 'didReceiveSettings') {
                    const settings = jsonObj.payload.settings;
                    document.getElementById('channel').value = settings.channel || '1';
                    document.getElementById('group').value = settings.group || '0';
                    document.getElementById('serverUrl').value = settings.serverUrl || '';
                }
            };

            // Save settings when changed
            document.getElementById('channel').addEventListener('change', saveSettings);
            document.getElementById('group').addEventListener('change', saveSettings);
            document.getElementById('serverUrl').addEventListener('change', saveSettings);
            document.getElementById('serverUrl').addEventListener('blur', saveSettings); // Save on blur too

            // Save with debounce when typing
            let saveTimeout;
            document.getElementById('serverUrl').addEventListener('input', function() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveSettings, 500);
            });
        }

        function saveSettings() {
            const serverUrlInput = document.getElementById('serverUrl');
            let serverUrl = serverUrlInput.value.trim();

            // Validate URL if provided
            if (serverUrl && !serverUrl.startsWith('http://') && !serverUrl.startsWith('https://')) {
                console.warn('[NDI Intercom] Invalid URL format. Must start with http:// or https://');
                serverUrlInput.style.borderColor = '#ff6b6b';
                setTimeout(() => { serverUrlInput.style.borderColor = '#3d3d3d'; }, 2000);
                return;
            }

            const settings = {
                channel: document.getElementById('channel').value,
                group: document.getElementById('group').value,
                serverUrl: serverUrl || undefined
            };

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const json = {
                    event: 'setSettings',
                    context: uuid,
                    payload: settings
                };
                websocket.send(JSON.stringify(json));
                console.log('[NDI Intercom] Settings saved:', settings);
            }
        }
    </script>
</body>
</html>
