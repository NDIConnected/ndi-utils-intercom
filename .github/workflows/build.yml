name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "NDI-Intercom.sln"

      - name: Build
        # CI verifies compilation only. The NDI native DLL is not on the runner
        # (Condition="Exists(...)" in .csproj), so artifacts from this workflow
        # are not runnable without a local publish + NDI SDK install.
        run: dotnet build "NDI-Intercom.sln" -c Release --no-restore
