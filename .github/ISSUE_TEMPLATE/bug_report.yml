---
name: Bug report
description: Report a problem with NDI Intercom16 or NDI Intercom2
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues with exploit details should **not** be filed here — use [Security Advisories](https://github.com/NDIConnected/ndi-utils-intercom/security/advisories/new) instead.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - NDI Intercom16
        - NDI Intercom2
        - Both / shared component
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. 1.7.3 from About / installer / `/healthz`
      placeholder: "1.7.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, NDI Tools/runtime version, ASIO device (if relevant), network setup
      placeholder: Windows 11 x64, NDI Tools 6.x, ...

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `%ProgramData%\NDI Intercom16\logs` (or Intercom2)
